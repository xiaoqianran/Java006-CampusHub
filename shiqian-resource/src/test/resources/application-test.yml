spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

  data:
    redis:
      host: localhost
      port: 6379
      database: 1
    elasticsearch:
      repositories:
        enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

resource:
  messaging:
    outbox:
      enabled: false
    monitor:
      enabled: false
  upload-dir: target/test-uploads
  upload:
    max-file-size: 52428800
    max-files-per-request: 10
    max-concurrent-files: 16
    max-user-storage: 1073741824
    max-text-preview-bytes: 524288
    max-archive-preview-entries: 500
    allowed-extensions: pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,jpg,jpeg,png,gif,webp,zip,rar,7z,java,py,js,ts,vue,c,cpp,h,go,rs,sql,json,xml,yaml,yml,html,css,sh

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
