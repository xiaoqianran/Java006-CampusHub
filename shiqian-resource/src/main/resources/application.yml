server:
  port: 8082

spring:
  application:
    name: shiqian-resource
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          shiqian-user:
            connect-timeout: ${USER_CLIENT_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${USER_CLIENT_READ_TIMEOUT_MS:2000}
            logger-level: basic
  datasource:
    url: ${RESOURCE_DB_URL:jdbc:mysql://127.0.0.1:3306/shiqian_resource?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${RESOURCE_DB_USER:root}
    password: ${RESOURCE_DB_PASSWORD:${MYSQL_ROOT_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4
    validate-migration-naming: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:8}
        prefetch: ${RABBITMQ_CONSUMER_PREFETCH:20}
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB

resource:
  counter:
    enabled: ${RESOURCE_COUNTER_ENABLED:true}
    flush-interval-ms: ${RESOURCE_COUNTER_FLUSH_INTERVAL_MS:10000}
    flush-initial-delay-ms: ${RESOURCE_COUNTER_FLUSH_INITIAL_DELAY_MS:10000}
    view-dedup-ttl: ${RESOURCE_VIEW_DEDUP_TTL:30m}
    scan-batch-size: ${RESOURCE_COUNTER_SCAN_BATCH_SIZE:100}
    batch-retention: ${RESOURCE_COUNTER_BATCH_RETENTION:7d}
  user-client:
    url: ${USER_SERVICE_URL:}
    service-key: ${INTERNAL_SERVICE_KEY:}
  cache:
    default-ttl: ${CACHE_DEFAULT_TTL:15m}
    resource-detail-ttl: ${CACHE_RESOURCE_DETAIL_TTL:20m}
    category-tree-ttl: ${CACHE_CATEGORY_TREE_TTL:60m}
    null-ttl: ${CACHE_NULL_TTL:60s}
    jitter: ${CACHE_TTL_JITTER:5m}
  messaging:
    outbox:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
      base-backoff: ${OUTBOX_BASE_BACKOFF:5s}
      max-backoff: ${OUTBOX_MAX_BACKOFF:10m}
      claim-timeout: ${OUTBOX_CLAIM_TIMEOUT:2m}
      confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:5s}
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
      initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:3000}
    monitor:
      enabled: ${RABBIT_QUEUE_MONITOR_ENABLED:true}
      warning-threshold: ${RABBIT_QUEUE_WARNING_THRESHOLD:1000}
      poll-interval-ms: ${RABBIT_QUEUE_MONITOR_INTERVAL_MS:15000}
      initial-delay-ms: ${RABBIT_QUEUE_MONITOR_INITIAL_DELAY_MS:15000}
  search:
    consistency-interval-ms: ${RESOURCE_SEARCH_CONSISTENCY_INTERVAL_MS:3600000}
    consistency-initial-delay-ms: ${RESOURCE_SEARCH_CONSISTENCY_INITIAL_DELAY_MS:600000}
  upload-dir: uploads/resources
  storage:
    provider: ${STORAGE_PROVIDER:local}
    signed-url-ttl: ${STORAGE_SIGNED_URL_TTL:10m}
    temporary-ttl: ${STORAGE_TEMPORARY_TTL:24h}
    cleanup-batch-size: ${STORAGE_CLEANUP_BATCH_SIZE:100}
    cleanup-interval-ms: ${STORAGE_CLEANUP_INTERVAL_MS:3600000}
    cleanup-initial-delay-ms: ${STORAGE_CLEANUP_INITIAL_DELAY_MS:600000}
    local:
      root: ${LOCAL_STORAGE_ROOT:uploads/objects}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:campushub-resources}
  upload:
    max-file-size: 52428800
    max-files-per-request: 10
    max-concurrent-files: 16
    max-user-storage: 1073741824
    max-text-preview-bytes: 524288
    max-archive-preview-entries: 500
    allowed-extensions: pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,jpg,jpeg,png,gif,webp,zip,rar,7z,java,py,js,ts,vue,c,cpp,h,go,rs,sql,json,xml,yaml,yml,html,css,sh

jimeng:
  ingest:
    token: ${JIMENG_INGEST_TOKEN:}
    user-id: ${JIMENG_IMPORT_USER_ID:1}
    allowed-image-hosts: ${JIMENG_ALLOWED_IMAGE_HOSTS:p11-dreamina-sign.byteimg.com,p26-dreamina-sign.byteimg.com}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:7200000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: shiqian-resource

platform:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:false}
