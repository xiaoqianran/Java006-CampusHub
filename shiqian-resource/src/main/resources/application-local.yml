spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

resource:
  user-client:
    url: ${USER_SERVICE_URL:http://localhost:8081}

server:
  address: ${INTERNAL_SERVER_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
