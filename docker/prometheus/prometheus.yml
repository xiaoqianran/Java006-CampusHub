global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shiqian-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:8080
        labels:
          application: shiqian-gateway

  - job_name: shiqian-user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:8081
        labels:
          application: shiqian-user

  - job_name: shiqian-resource
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:8082
        labels:
          application: shiqian-resource

  - job_name: redis
    static_configs:
      - targets:
          - 127.0.0.1:9121

  - job_name: rabbitmq
    static_configs:
      - targets:
          - 127.0.0.1:15692

  - job_name: elasticsearch
    static_configs:
      - targets:
          - 127.0.0.1:9114
