"**":
  push:
    - name: maven-ci
      runner:
        cpus: 4
      docker:
        image: maven:3.9-eclipse-temurin-17
        volumes:
          - .m2:/root/.m2:rw
      stages:
        - name: validate
          script: mvn validate -B
        - name: compile
          script: mvn compile -B
        - name: test
          script: mvn test -B
        - name: package
          script: mvn package -DskipTests -B
        - name: dependency-check
          script: mvn dependency:tree -B

  pull_request:
    - name: maven-ci
      runner:
        cpus: 4
      docker:
        image: maven:3.9-eclipse-temurin-17
        volumes:
          - .m2:/root/.m2:rw
      stages:
        - name: validate
          script: mvn validate -B
        - name: compile
          script: mvn compile -B
        - name: test
          script: mvn test -B
        - name: package
          script: mvn package -DskipTests -B
        - name: dependency-check
          script: mvn dependency:tree -B
