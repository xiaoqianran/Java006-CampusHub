server:
  port: 8080

spring:
  application:
    name: shiqian-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        - id: shiqian-user
          uri: lb://shiqian-user
          predicates:
            - Path=/api/user/**
        - id: shiqian-resource
          uri: lb://shiqian-resource
          predicates:
            # 即梦同步仅允许直连 resource 本机端口，不经由公网网关暴露。
            - Path=/api/resource/**,/api/category/**,/api/tag/**,/api/admin/**

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:7200000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

gateway:
  auth:
    whitelist:
      - /api/user/register
      - /api/user/login
      - /api/user/refresh
      - /api/user/health
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: false
  metrics:
    tags:
      application: shiqian-gateway
