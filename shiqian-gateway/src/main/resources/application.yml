server:
  port: 8080

spring:
  application:
    name: shiqian-gateway
  profiles:
    active: local
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: shiqian-user
          uri: lb://shiqian-user
          predicates:
            - Path=/api/user/**
        - id: shiqian-resource
          uri: lb://shiqian-resource
          predicates:
            - Path=/api/resource/**,/api/category/**

jwt:
  secret: shiqian-platform-jwt-secret-key-must-be-at-least-256-bits-for-hs256
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

gateway:
  auth:
    whitelist:
      - /api/user/register
      - /api/user/login
      - /api/user/health
      - /actuator
