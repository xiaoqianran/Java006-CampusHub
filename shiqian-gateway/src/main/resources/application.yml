server:
  port: 8080

spring:
  application:
    name: shiqian-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: shiqian-user
          uri: lb://shiqian-user
          predicates:
            - Path=/api/user/**
        - id: shiqian-resource
          uri: lb://shiqian-resource
          predicates:
            - Path=/api/resource/**,/api/category/**,/api/admin/**

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:7200000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

gateway:
  auth:
    whitelist:
      - /api/user/register
      - /api/user/login
      - /api/user/refresh
      - /api/user/health
      - /actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: shiqian-gateway
