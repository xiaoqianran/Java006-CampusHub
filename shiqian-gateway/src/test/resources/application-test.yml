spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
        - id: shiqian-user
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        - id: shiqian-resource
          uri: http://localhost:8082
          predicates:
            - Path=/api/resource/**,/api/category/**,/api/tag/**,/api/admin/**,/api/jimeng/**

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

gateway:
  auth:
    whitelist:
      - /api/user/register
      - /api/user/login
      - /api/user/refresh
      - /api/user/health
      - /actuator
