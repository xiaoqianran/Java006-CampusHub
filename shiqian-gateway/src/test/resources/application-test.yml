spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
        - id: shiqian-user
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        - id: shiqian-resource
          uri: http://localhost:8082
          predicates:
            - Path=/api/resource/**,/api/category/**
