name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate
        run: mvn -B validate

      - name: Test
        run: mvn -B test

      - name: Print backend test failures
        if: failure()
        run: |
          find . -path '*/target/surefire-reports/*.txt' -type f -print -exec tail -n 200 {} \;
          find . -path '*/target/surefire-reports/*.dumpstream' -type f -print -exec tail -n 200 {} \;

      - name: Package
        run: mvn -B package -DskipTests

      - name: Validate startup scripts
        run: bash -n 01_Environment.sh 02_StartBackend.sh 03_StopBackend.sh 04_StartFrontend.sh 05_StopFrontend.sh restart-backend.sh

      - name: Validate Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          REDIS_PASSWORD: ci-only-password
          RABBITMQ_USER: ci-user
          RABBITMQ_PASSWORD: ci-only-password
          MINIO_ACCESS_KEY: ci-minio
          MINIO_SECRET_KEY: ci-only-password
          GRAFANA_ADMIN_USER: ci-admin
          GRAFANA_ADMIN_PASSWORD: ci-only-password
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.low-memory.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.low-memory.yml config \
            | grep -q -- '--web.listen-address=127.0.0.1:19090'

      - name: Upload backend jars
        uses: actions/upload-artifact@v5
        with:
          name: backend-jars
          path: |
            shiqian-user/target/*.jar
            shiqian-resource/target/*.jar
            shiqian-gateway/target/*.jar

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: shiqian-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shiqian-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upload frontend dist
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: shiqian-frontend/dist
