spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

server:
  address: ${INTERNAL_SERVER_ADDRESS:127.0.0.1}

campushub:
  auth:
    # localhost 开发通常使用 HTTP；生产 profile 不应继承这个覆盖。
    refresh-cookie:
      secure: false
      same-site: Lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true
  production: false
