server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://127.0.0.1:3306/shiqian_user?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${USER_DB_USER:root}
    password: ${USER_DB_PASSWORD:${MYSQL_ROOT_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

campushub:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:}
  auth:
    # 浏览器认证接口只接受这些精确 Origin。生产环境必须显式覆盖为真实前端域名。
    allowed-origins: ${BROWSER_AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    refresh-cookie:
      name: ${REFRESH_TOKEN_COOKIE_NAME:campushub_refresh}
      secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
      same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
      domain: ${REFRESH_TOKEN_COOKIE_DOMAIN:}

rbac:
  authority-cache-ttl: ${RBAC_AUTHORITY_CACHE_TTL:24h}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置：access token 短生命周期，refresh token 仅通过 HttpOnly Cookie 持久化。
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: false
  metrics:
    tags:
      application: shiqian-user

platform:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:false}

# 生产默认关闭 API 文档，避免接口面泄露；local profile 再打开。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
knife4j:
  enable: ${SPRINGDOC_ENABLED:false}
  production: ${KNIFE4J_PRODUCTION:true}
