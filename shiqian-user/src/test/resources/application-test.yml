spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:user_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 15
  rabbitmq:
    listener:
      simple:
        auto-startup: false

jwt:
  secret: test-only-jwt-key-with-at-least-thirty-two-bytes
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

campushub:
  internal:
    service-key: test-only-internal-service-key

platform:
  rate-limit:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
